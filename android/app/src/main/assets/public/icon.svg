<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c5cfc" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Accent Circle Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Bi-Directional Locker Shackle / Arrows Icon -->
  <g transform="translate(136, 126)" filter="url(#glow)">
    <!-- Locker Outer Container -->
    <rect x="20" y="110" width="200" height="150" rx="36" fill="#12121a" stroke="url(#accentGrad)" stroke-width="14" />

    <!-- Locker Shackle -->
    <path d="M60 110 V65 A60 60 0 0 1 180 65 V110" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Up/Down Transfer Symbol -->
    <path d="M120 155 V215" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" />
    <path d="M102 175 L120 155 L138 175" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="120" cy="215" r="7" fill="#7c5cfc" />
  </g>
</svg>
