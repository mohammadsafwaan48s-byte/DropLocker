name: Build DropLocker Apps (Windows .exe & Android .apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Build Windows Desktop App (.exe)
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    name: Build Windows .exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Desktop Dependencies
        run: |
          npm install
          cd desktop
          npm install

      - name: Build Windows Executable
        run: |
          cd desktop
          npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLocker-Windows
          path: dist-desktop/*.exe

  # =========================================================================
  # 2. Build Android Native App (.apk)
  # =========================================================================
  build-android:
    runs-on: ubuntu-latest
    name: Build Android .apk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Preserve Share Target in AndroidManifest
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Manifest present"
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/DropLocker.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLocker-Android
          path: output-apk/DropLocker.apk

  # =========================================================================
  # 3. Create GitHub Release with 2 Direct Download Links
  # =========================================================================
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    name: Publish Release with Download Links
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DropLocker-Windows
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: DropLocker-Android
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: DropLocker Apps v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## 🚀 DropLocker Native Applications
            
            ### 📥 Direct Download Links:
            - **Windows Laptop:** Download `DropLocker-Setup.exe` or portable `.exe` below.
            - **Android Phone:** Download `DropLocker.apk` and tap install on your phone.
            
            ### Features:
            - 24/7 Cloud Sync via Cloudflare Workers + KV + D1
            - Windows System Tray + Global `Ctrl+Shift+V` Hotkey
            - Native Android Share Sheet Integration
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
