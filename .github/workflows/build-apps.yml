name: Build DropLocker Apps (Windows .exe & Android .apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Build Windows Desktop App (.exe)
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    name: Build Windows .exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows Executable
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLocker-Windows
          path: dist-desktop/*.exe

  # =========================================================================
  # 2. Build Android Native App (.apk)
  # =========================================================================
  build-android:
    runs-on: ubuntu-latest
    name: Build Android .apk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save

      - name: Initialize Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android 2>&1 || true
          npx cap sync android 2>&1

      - name: Debug - Check Android Project Files
        run: |
          echo "=== Listing android/ ==="
          ls -la android/ || echo "android/ not found"
          echo "=== Listing android/app/ ==="
          ls -la android/app/ || echo "android/app/ not found"
          echo "=== Checking gradlew ==="
          ls -la android/gradlew || echo "gradlew not found"

      - name: Inject Custom AndroidManifest with Share Sheet
        run: |
          if [ -f android-template/AndroidManifest.xml ] && [ -d android/app/src/main ]; then
            cp -f android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "Injected custom AndroidManifest.xml"
          else
            echo "Skipping manifest injection"
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/DropLocker.apk \;
          ls -la output-apk/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLocker-Android
          path: output-apk/DropLocker.apk

  # =========================================================================
  # 3. Create GitHub Release with 2 Direct Download Links
  # =========================================================================
  release:
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    name: Publish Release with Download Links
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DropLocker-Windows
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: DropLocker-Android
          path: release-files

      - name: List Release Files
        run: ls -la release-files/ || echo "No release files"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: DropLocker Apps v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## 🚀 DropLocker Native Applications
            
            ### 📥 Direct Download Links:
            - **Windows Laptop:** Download `DropLocker Setup 1.0.0.exe` below and run it.
            - **Android Phone:** Download `DropLocker.apk` below and install it.
            
            ### Features:
            - 24/7 Cloud Sync via Cloudflare Workers + KV + D1
            - Windows System Tray + Global `Ctrl+Shift+V` Hotkey
            - Native Android Share Sheet Integration
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
